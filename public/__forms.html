<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Form definitions</title></head>
  <body>
    <form name="rental-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="rental-inquiry">
      <input name="bot-field">
      <input name="name">
      <input name="phone">
      <input name="email">
      <input name="item">
      <input name="term">
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
